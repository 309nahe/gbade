# GBADE continuous integration.
#
# Runs only when something lands on main (a merged pull request, or a direct
# push), never on every commit of a feature branch. It can also be started by
# hand from the Actions tab ("Run workflow"), for one platform or both.
# Pushing a tag named v* (e.g. v0.1.0) runs both jobs and then publishes a
# GitHub release with the DMG and the Linux executable attached.
#
# Two jobs, one per shipped platform. Each one:
#   1. fetches the official LLVM release for that platform (cached),
#   2. builds mGBA and every crate, and runs the whole test suite,
#   3. builds the package (macOS: GBADE.app + DMG; Linux: one self-extracting
#      executable), smoke-tests it on every example, and uploads it.
#
# Cost note: macOS runners count 10x against the private-repo Actions quota,
# Linux runners 1x.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        options: [all, linux, macos]
        default: all

# A newer merge makes an older, still-running build pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  LLVM_VERSION: "23.1.5"

jobs:
  macos:
    name: macOS arm64 (DMG)
    if: github.event_name == 'push' || inputs.platforms != 'linux'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out (with the mGBA submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Cache the LLVM toolchain
        uses: actions/cache@v4
        with:
          path: .cache/llvm
          key: llvm-${{ env.LLVM_VERSION }}-macos-arm64

      - name: Fetch LLVM (clang + lld)
        run: cargo xtask fetch-llvm

      - name: Free disk space used by the LLVM archive
        run: rm -f .cache/*.tar.xz

      - name: Run all tests
        run: cargo test --workspace

      - name: Build GBADE.app and the DMG
        run: cargo xtask dmg

      - name: Smoke-test the bundled app on every example
        run: cargo xtask smoke

      - name: Upload the DMG
        uses: actions/upload-artifact@v4
        with:
          name: GBADE-macos-dmg
          path: target/GBADE-*.dmg
          retention-days: 14

      - name: Upload screenshots (UI tests and examples)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos
          path: |
            target/ui-snapshots/*.png
            target/smoke/*.png
          if-no-files-found: ignore
          retention-days: 14

  linux:
    name: Linux x86_64 (single file)
    if: github.event_name == 'push' || inputs.platforms != 'macos'
    # The oldest supported Ubuntu: the binary then only needs glibc 2.35,
    # so it also runs on older distributions than the newest runner image.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out (with the mGBA submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        # ALSA headers for sound (cpal); Mesa's software Vulkan driver so the
        # headless UI tests can render screenshots without a GPU.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config cmake mesa-vulkan-drivers

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Cache the LLVM toolchain
        uses: actions/cache@v4
        with:
          path: .cache/llvm
          key: llvm-${{ env.LLVM_VERSION }}-linux-x64

      - name: Fetch LLVM (clang + lld)
        run: cargo xtask fetch-llvm

      - name: Free disk space used by the LLVM archive
        run: rm -f .cache/*.tar.xz

      - name: Show what the bundled compiler links against
        run: |
          ldd .cache/llvm/bin/clang-23 .cache/llvm/bin/lld || true
          .cache/llvm/bin/clang --version

      - name: Run all tests
        run: cargo test --workspace

      - name: Build the single-file executable
        run: cargo xtask linux

      - name: Smoke-test the single file on every example
        run: cargo xtask smoke

      - name: Show what the GBADE executable links against
        run: ldd target/release/gbade

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: gbade-linux-x86_64
          path: target/gbade-*-linux-x86_64
          retention-days: 14

      - name: Upload screenshots (UI tests and examples)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux
          path: |
            target/ui-snapshots/*.png
            target/smoke/*.png
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish GitHub release
    # Only for version tags, and only once both packages are built and tested.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the DMG
        uses: actions/download-artifact@v4
        with:
          name: GBADE-macos-dmg
          path: dist

      - name: Download the Linux executable
        uses: actions/download-artifact@v4
        with:
          name: gbade-linux-x86_64
          path: dist

      - name: Create the release and attach the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "GBADE $GITHUB_REF_NAME" \
            --generate-notes
