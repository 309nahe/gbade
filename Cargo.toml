[workspace]
resolver = "3"
members = ["crates/gbade-emu", "crates/gbade-toolchain", "crates/gbade", "xtask"]
default-members = ["crates/gbade"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["GBADE contributors"]
repository = "https://github.com/309nahe/gbade"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4

# Since Rust 1.77, release builds run the system `strip` on everything they
# produce. On recent macOS versions that corrupts the proc-macro libraries the
# compiler loads while building (dyld: "mis-aligned LINKEDIT string pool"), so
# build-time code (proc macros, build scripts) is never stripped.
[profile.release.build-override]
strip = false
debug = false
