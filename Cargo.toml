[workspace]
resolver = "3"
members = ["crates/gbade-emu", "crates/gbade-toolchain", "crates/gbade", "xtask"]
default-members = ["crates/gbade"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["GBADE contributors"]
repository = "https://github.com/309nahe/gbade"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
